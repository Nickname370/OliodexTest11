<title>Oliodex</title>

<style>
/* UUSI YLÄPALKKI: Pitää elementit yhdessä ylhäällä rullatessa */
.ylapalkki {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
	background: #457b9d;
    backdrop-filter: blur(5px);    /* Hämärtää taustaa tyylikkäästi */
    display: flex;
    align-items: center;
    padding: 0 20px;
    box-sizing: border-box;
    z-index: 1100;
    gap: 15px;                      /* Jättää automaattisesti väliä elementtien väliin */
}

/* Runko tarvitsee nyt paddingia ylhääle, jotta yläpalkki ei peitä sisältöä */
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    padding-top: 90px; /* Nostettu 70px -> 90px */
    margin: 0;
    background: #0fd429;
    background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url("Tausta1.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
}

/* Uusittu nappi yläpalkin sisälle */
.valikko-nappi {
    font-size: 24px;
    background: #457b9d;
    color: white;
    border: none;
    border-radius: 8px;
    width: 45px;
    height: 45px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: 0.2s;
    flex-shrink: 0; /* Estää nappia puristumasta kasaan */
    z-index: 5600;  /* UUSI: Nostaa napin sivupalkin (1200) yläpuolelle */
}

/* Tyyli napille, kun valikko on auki */
.valikko-nappi.nappi-auki {
    background: #d62828;
}

.valikko-nappi:hover {
    transform: scale(1.1);
    background: #d62828;
}

/* Otsikko yläpalkissa */
h1 {
    color: #ffffff; 
    background: #457b9d;
    border-radius: 10px;    
    padding: 8px 15px;     
    margin: 0;             /* Poistetaan oletusmarginaalit */
    font-size: 30px;       /* Pienennetty hieman, jotta mahtuu yläpalkkiin */
    white-space: nowrap;   /* Estää tekstin rivittymisen */
}
h1 a {
    color: white;
    text-decoration: none;
    cursor: pointer;
}

h1 a:hover {
    text-decoration: none;
}

.haku-ryhma {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 405px;
}

#haku { 
    flex: 1; 
    width: auto; 
    max-width: none;
    height: 45px;
    padding: 0 18px;
    box-sizing: border-box;
    border: none;
    border-radius: 15px;
    font-size: 16px;
    outline: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.random-nappi {
    width: 45px;
    height: 45px;
    flex-shrink: 0.2;
    border: none;
    border-radius: 8px;
    background: #457b9d;
    color: white;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: 0.2s;
}

.random-nappi:hover {
    transform: scale(1.1) rotate(15deg);
    background: #d62828;
}

.random-nappi:active {
    transform: scale(0.95) rotate(30deg);
}

/* Varmistetaan että sivupalkki aukeaa yläpalkin alta oikein */
.sivupalkki {
    position: fixed;
    top: 0;
    left: -260px; 
    width: 250px;
    height: 100%;
    background: white;
    box-shadow: 4px 0 15px rgba(0,0,0,0.15);
    z-index: 1000;   
    transition: left 0.3s ease;
    padding: 20px;
    box-sizing: border-box;
    padding-top: 90px;     /* Lisätty tilaa yläreunaan */
}


.sivupalkki.auki {
    left: 0; /* Liukuu näkyviin */
}

.sivupalkki h3 {
    margin-bottom: 15px;
    color: #333;
    border-bottom: 2px solid #f4f4f9;
    padding-bottom: 5px;
}

.sivupalkki ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.sivupalkki li {
    padding: 12px;
    margin-bottom: 5px;
    background: #457b9d;
	color: white;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

.sivupalkki li:hover {
    transform: scale(1.05);
    background: #d62828;
    color: white;
}

/* Alueen otsikko gridissä (vie koko rivin) */
.alue-otsikko {
    grid-column: 1 / -1;
    margin-top: 10px;
    margin-bottom: 10px;
    background: #457b9d;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 27px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.kortti {
    background: white;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: all 0.25s ease;
}

.kortti:hover {
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.kortti img {
    width: 100px;
    height: 100px;
    object-fit: contain;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    justify-content: center; /* Pitää sisällön vaakasuunnassa keskellä */
    align-items: flex-end;    /* Siirtää sisällön pystysuunnassa alareunaan */
    padding-bottom: 40px;    /* Jättää pienen raon modalin ja näytön alareunan väliin */
    z-index: 9000;
}

.modal-sisalto {
    background: white;
    padding: 25px;
    border-radius: 15px;
    width: 90%;
    max-width: 600px;
    text-align: center;
    position: relative;
    animation: nouseAlhaalta 0.3s ease; /* Vaihdettu uusi animaatio */
}

@keyframes nouseAlhaalta {
    from {
        transform: translateY(100px); /* Alkaa 100 pikseliä alempaa */
        opacity: 0;
    }
    to {
        transform: translateY(0);     /* Pysähtyy omalle paikalleen */
        opacity: 1;
    }
}


.modal img {
    width: 180px;
    height: 180px;
    object-fit: contain;
}

.sulje {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 50px;
    cursor: pointer;
}

.pokedex {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 20px;
}

@media (max-width: 1000px) {
    .pokedex {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .pokedex {
        grid-template-columns: 1fr;
    }
}

.kehitys {
    display: inline-block;
    margin: 5px;
    padding: 8px 12px;
    background: #e63946;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.kehitys:hover {
    transform: scale(1.08);
}

.esikehitys {
    display: inline-block;
    margin: 5px;
    padding: 8px 12px;
    background: #457b9d;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.esikehitys:hover {
    transform: scale(1.08);
}

.harvinaisuus {
    display: inline-block;
    margin: 10px 0;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    color: white;
    background: linear-gradient(45deg, blue, orange);
}
.virhe-keskitys {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000; /* Varmistaa, että laatikko ei jää muiden elementtien alle */
    background-color: rgba(0, 0, 0, 0.3); /* Tummentaa muun näytön, jotta laatikko erottuu */

.virhe-laatikko {
    color: white;
    background-color: #457b9d !important; /* !important varmistaa, ettei mikään muu tyyli ylikirjoita tätä */

    padding: 20px 40px;
    border-radius: 15px;
    font-size: 100px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);

html {

position:absolute; 
top:7.5px; 
right:15px; 
padding:10px 14px; 
font-size:26px; 
cursor:pointer; 
border-radius: 15px;

.play-btn:hover {
    transform: scale(1.03);
	transition: all 0.3s ease;

const pokedex = document.getElementById("pokedex");

function toggleSivupalkki(event) {
    const sivupalkki = document.getElementById("sivupalkki");
    const nappi = document.querySelector(".valikko-nappi");
    
    // Vaihtaa luokan 'auki' päälle tai pois
    sivupalkki.classList.toggle("auki");
    
    // Jos sivupalkki on auki, muutetaan nappi ruksiksi ja punaiseksi
    if (sivupalkki.classList.contains("auki")) {
        nappi.innerHTML = "✕";
        nappi.classList.add("nappi-auki");
    } else {
        nappi.innerHTML = "☰";
        nappi.classList.remove("nappi-auki");
    }
}

// Skrollataan halutun alueen otsikon kohdalle
function skrollaaAlueeseen(alueId) {
    const kohde = document.getElementById(alueId);
    if (kohde) {
        kohde.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    suljeSivupalkki();
}

function arvoRandomPokemon() {
    const validitPokemonit = pokemonit.filter(pokemon =>
        pokemon.nimi && pokemon.nimi.trim() !== ""
    );

    if (validitPokemonit.length === 0) return;

    const satunnainen = validitPokemonit[
        Math.floor(Math.random() * validitPokemonit.length)
    ];

    avaaPokemon(pokemonit.indexOf(satunnainen));
}

// Modalin avaaminen ja tietojen täyttäminen
function avaaPokemon(id) {
    if (id === -1) return; 
    const pokemon = pokemonit[id];

    document.getElementById("modalKuva").src = pokemon.kuva;
    document.getElementById("modalNimi").textContent = pokemon.nimi;
    document.getElementById("modalNumero").textContent = pokemon.numero;
    document.getElementById("modalTyyppi").textContent = pokemon.tyyppi;
    document.getElementById("modalTieteellinen").textContent = pokemon.tieteellinenNimi || "Ei tieteellistä nimeä";
	document.getElementById("modalTieto").textContent =
    pokemon.tieto || "Tietoa ei ole saatavilla.";

document.getElementById("modalHarvinaisuus").innerHTML =
    `<span class="harvinaisuus">${pokemon.harvinaisuus || "Tuntematon"}</span>`;

    // Esikehityksen käsittely
    const esikehitysDiv = document.getElementById("modalEsikehitys");
    esikehitysDiv.innerHTML = "";
    
    if (!pokemon.esikehitys) {
        esikehitysDiv.textContent = "Ei esikehitystä";
    } else {
        const esiId = pokemonit.findIndex(p => p.nimi === pokemon.esikehitys);
        const nappi = document.createElement("span");
        nappi.className = "esikehitys";
        nappi.textContent = pokemon.esikehitys;
        nappi.onclick = () => avaaPokemon(esiId);
        esikehitysDiv.appendChild(nappi);
    }

    // Kehitysmuotojen käsittely
    const kehitysDiv = document.getElementById("modalKehitykset");
    kehitysDiv.innerHTML = "";

    if (!pokemon.kehitysmuodot || pokemon.kehitysmuodot.length === 0) {
        kehitysDiv.textContent = "Ei jatkokehitysmuotoja";
    } else {
        pokemon.kehitysmuodot.forEach(nimi => {
            const kehitysPokemon = pokemonit.findIndex(p => p.nimi === nimi);
            const nappi = document.createElement("span");
            nappi.className = "kehitys";
            nappi.textContent = nimi;
            nappi.onclick = () => avaaPokemon(kehitysPokemon);
            kehitysDiv.appendChild(nappi);
        });
    }

    document.getElementById("modal").style.display = "flex";
}

function suljeModal() {
    document.getElementById("modal").style.display = "none";
}

// Klikkaukset ikkunan ulkopuolella (sulkee modalin tai sivupalkin)
window.onclick = function(event) {
    const modal = document.getElementById("modal");
    const sivupalkki = document.getElementById("sivupalkki");

    if (event.target === modal) {
        suljeModal();
    }
    if (!sivupalkki.contains(event.target)) {
        suljeSivupalkki();
    }
};

// Luodaan sivupalkkiin lista alueista automaattisesti datan pohjalta
function paivitaAluevalikko() {
    const alueLista = document.getElementById("alueLista");
    alueLista.innerHTML = "";
    
    const alueet = [...new Set(pokemonit.map(p => p.alue).filter(Boolean))];
    
    alueet.forEach(alue => {
        const li = document.createElement("li");
        li.textContent = alue;
        li.onclick = () => skrollaaAlueeseen("alue-" + alue);
        alueLista.appendChild(li);
    });
}

// Olioiden ja alueotsikoiden tulostus näytölle
function naytaPokemonit(lista) {
    pokedex.innerHTML = "";
    const validitOliot = lista.filter(p => p.nimi && p.nimi.trim() !== "");

if (validitOliot.length === 0) {
    pokedex.innerHTML = `
        <div class="virhe-keskitys">
            <p class="virhe-laatikko">Olioita ei löytynyt.</p>
        </div>
    `;
    return;
}

    let nykyinenAlue = "";

    validitOliot.forEach(pokemon => {
        if (pokemon.alue && pokemon.alue !== nykyinenAlue) {
            nykyinenAlue = pokemon.alue;
            pokedex.innerHTML += `
                <div class="alue-otsikko" id="alue-${nykyinenAlue}">
                    ${nykyinenAlue}
                </div>
            `;
        }

        pokedex.innerHTML += `
            <div class="kortti" onclick="avaaPokemon(${pokemonit.indexOf(pokemon)})">
                <img src="${pokemon.kuva}" alt="${pokemon.nimi}">
                <h2>${pokemon.nimi}</h2>
                <p>${pokemon.numero}</p>
                <span class="tyyppi">${pokemon.tyyppi}</span>
            </div>
        `;
    });
}

// Alustukset sivun latautuessa
naytaPokemonit(pokemonit);
paivitaAluevalikko();

// Hakutoiminto (nimi tai numero)
document.getElementById("haku").addEventListener("input", e => {
    const hakusana = e.target.value.toLowerCase();
    
    const tulokset = pokemonit.filter(pokemon =>
        (pokemon.nimi && pokemon.nimi.toLowerCase().includes(hakusana)) || 
        (pokemon.numero && pokemon.numero.toLowerCase().includes(hakusana))
    );
    
    naytaPokemonit(tulokset);
});
